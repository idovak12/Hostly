<!doctype html><html lang="he"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>דשבורד האולם</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600&display=swap">
<style>
/* Layout: frosted top bar with views (overview / events / finance / control); single reading column with a side "needs attention" rail on wide screens.
   Design: macOS-like, light only. Light gray base washed with light blue, translucent glass surfaces, navy as the main color, soft charcoal text. */
:root{
  --bg:#ECECEF; --bg2:#E6E6EA; --fill:rgba(0,0,0,.055); --card:rgba(255,255,255,.4); --card-solid:#FFFFFF;
  --fg:#3A3A3C; --head:#2F3033; --muted:#6E6E73; --faint:#8E8E93;
  --accent:#1E3A5F; --accent-hover:#16304F; --on-accent:#FFFFFF; --on-fg:#F5F5F7;
  --sky:#7EA8D8; --sky-soft:#DCE8F6;
  --nav:rgba(240,240,243,.52);
  --line:rgba(30,58,95,.09); --line-strong:rgba(30,58,95,.17); --glass-edge:rgba(255,255,255,.8);
  --shadow:none; --float:0 10px 30px rgba(30,58,95,.10);
  --good:#2E7D4A; --warn:#C4312B; --caution:#A65A00;
  --c-in:#24426B; --c-out:#7EA8D8;
  --accent-tint:rgba(126,168,216,.18);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Heebo',system-ui,'Segoe UI',Arial,sans-serif;
  --ease:cubic-bezier(.25,.1,.25,1);
  color-scheme:light;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:300;font-size:16px;line-height:1.6;letter-spacing:-.003em;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(50vw 55vh at 96% 2%, rgba(255,255,255,1), transparent 68%),
             radial-gradient(42vw 48vh at 6% 96%, rgba(178,178,188,.7), transparent 70%),
             radial-gradient(30vw 34vh at 18% 34%, rgba(30,58,95,.09), transparent 70%),
             radial-gradient(34vw 36vh at 62% 62%, rgba(196,196,204,.55), transparent 70%),
             radial-gradient(30vw 30vh at 84% 88%, rgba(255,255,255,.9), transparent 70%)}
h1,h2,h3{color:var(--head)}
/* instant feedback: controls react the moment they are pressed */
button,.btn,.seg a,.bnav a,a.tile,.ev{transition-property:background-color,color,border-color,opacity,transform;transition-duration:.25s;transition-timing-function:var(--ease)}
button:not(:disabled):active,.btn:active,.seg a:active,a.tile:active{transform:scale(.97);transition-duration:0s}
.ev:active,.tbl-target:active{transform:scale(.99);transition-duration:0s}
button,input,select{font-family:inherit;color:inherit;font-size:inherit}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-weight:500;font-size:1rem}
.brand span{font-size:.78rem;color:var(--muted);}
.seg{display:inline-flex;background:var(--fill);border-radius:8px;padding:2px;gap:2px}
.seg button,.seg a{border:0;background:transparent;padding:.38em 1.2em;border-radius:4px;font-weight:400;font-size:.9rem;cursor:pointer;color:var(--muted);text-decoration:none;transition:all .3s var(--ease);white-space:nowrap}
.seg button:hover,.seg a:hover{color:var(--fg)}
.seg [aria-pressed="true"],.seg [aria-current="page"]{background:var(--card);color:var(--fg);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.nav .today{margin-inline-start:auto;font-size:.82rem;color:var(--muted);}
.demo-bar{border-bottom:1px solid var(--line);background:var(--bg2);font-size:.84rem;color:var(--muted)}
.demo-bar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:8px;flex-wrap:wrap}
.demo-bar b{color:var(--accent);font-weight:500;margin-inline-end:8px}

/* ---------- type & structure ---------- */
main{padding-block:clamp(56px,7vw,104px) 128px}
.eyebrow{font-size:.76rem;font-weight:500;color:var(--accent)}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:clamp(36px,5vw,64px)}
.vhead h1{font-size:clamp(2rem,4.2vw,2.9rem);font-weight:500;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.vhead p{color:var(--muted);margin-top:12px;max-width:42em;font-size:1.04rem}
h2.sec{font-size:1.2rem;font-weight:500;letter-spacing:-.01em}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sechead .more{font-size:.88rem;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-strong)}
.sechead .more:hover{color:var(--fg)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.empty{font-size:.9rem;color:var(--faint);padding:18px 0}
.foot{padding-block:28px;color:var(--faint);font-size:.82rem;border-top:1px solid var(--line);}

/* ---------- surfaces ---------- */
.card{background-color:var(--card);border:1px solid var(--line);border-radius:8px;padding:clamp(24px,3vw,40px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:20px;margin-bottom:clamp(40px,5vw,72px)}
.tile{background-color:var(--card);border:1px solid var(--line);border-radius:8px;padding:26px 28px;text-align:start;display:flex;flex-direction:column;gap:4px;min-width:0}
button.tile,a.tile{cursor:pointer;text-decoration:none;transition:border-color .3s var(--ease)}
button.tile:hover,a.tile:hover{border-color:var(--line-strong)}
.tile .k{font-size:.8rem;color:var(--muted);}
.tile .v{font-size:clamp(1.7rem,3vw,2.2rem);font-weight:300;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .s{font-size:.82rem;color:var(--muted)}
.tile .s.warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:clamp(32px,4vw,64px);align-items:start}

/* ---------- buttons / pills / chips ---------- */
.btn{display:inline-block;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:6px;padding:.6em 1.4em;font-weight:500;font-size:.9rem;cursor:pointer;text-decoration:none;transition:all .3s var(--ease)}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--accent-tint);color:var(--fg);border-color:var(--line-strong)}
.small-btn{border:1px solid var(--line-strong);background:transparent;border-radius:6px;padding:.3em 1em;font-weight:400;cursor:pointer;font-size:.84rem;transition:all .3s var(--ease);white-space:nowrap}
.small-btn:hover{background:var(--accent-tint);border-color:var(--accent)}
.small-btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.small-btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.linkbtn{border:0;background:transparent;padding:0;cursor:pointer;color:var(--fg);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px;font-size:.88rem}
.pill{display:inline-block;font-size:.74rem;font-weight:500;border-radius:3px;padding:.15em .7em;background:var(--bg2);color:var(--muted);white-space:nowrap;border:1px solid var(--line);}
.pill.yes{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent);background:color-mix(in srgb,var(--good) 8%,transparent)}
.pill.no{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.pill.mid{color:var(--caution);border-color:color-mix(in srgb,var(--caution) 35%,transparent);background:color-mix(in srgb,var(--caution) 8%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:6px;padding:.3em .95em;font-weight:400;font-size:.86rem;cursor:pointer;transition:all .3s var(--ease);white-space:nowrap}
.chip:hover{background:var(--accent-tint)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip small{opacity:.7;margin-inline-start:4px;font-variant-numeric:tabular-nums}
.search{border:1px solid var(--line-strong);background:var(--card);border-radius:6px;padding:.42em .8em;min-width:0;width:220px;max-width:100%}
.toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:26px}
.toolbar .chips{flex:1 1 auto}

/* ---------- event rows ---------- */
.evlist{display:flex;flex-direction:column}
.month-h{display:flex;justify-content:space-between;align-items:baseline;font-size:.85rem;color:var(--muted);font-weight:600;padding:28px 14px 10px}
.evlist .month-h:first-child{padding-top:0}
/* grouped list, like macOS Settings: one rounded card, hairline separators that start after the date badge */
.group{border-radius:10px;overflow:hidden}
.ev{position:relative;display:grid;grid-template-columns:46px minmax(0,1fr) 128px 150px 118px 12px;grid-template-areas:"cal main rsvp state bal chev";gap:18px;align-items:center;padding:14px 18px;text-decoration:none;color:inherit}
.ev+.ev::before{content:"";position:absolute;top:0;inset-inline-start:82px;inset-inline-end:18px;height:1px;background:var(--line)}
.ev:hover{background:rgba(0,0,0,.035)}
.ev:hover+.ev::before,.ev:hover::before{opacity:0}
.cal{grid-area:cal;width:46px;height:50px;border-radius:9px;display:flex;flex-direction:column;align-items:center;overflow:hidden;line-height:1;
  background:rgba(255,255,255,.75);box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06)}
.cal-m{display:block;width:100%;text-align:center;font-size:.66rem;font-weight:600;color:var(--on-accent);background:var(--accent);padding:3px 0 2px}
.cal-d{font-size:1.32rem;font-weight:500;color:var(--head);font-variant-numeric:tabular-nums;margin-top:6px}
.ev-main{grid-area:main;min-width:0;display:flex;flex-direction:column}
.ev-main b{font-weight:600;font-size:.98rem;color:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-sub{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-more{font-size:.8rem;color:var(--accent);max-height:0;opacity:0;overflow:hidden;transition:max-height .3s var(--ease),opacity .25s var(--ease),margin .3s var(--ease)}
.ev:hover .ev-more,.ev:focus-visible .ev-more{max-height:22px;opacity:1;margin-top:3px}
.ev-info{display:contents}
.ev-rsvp{grid-area:rsvp;display:flex;align-items:center;gap:10px;min-width:0}
.ring{width:28px;height:28px;flex:none}
.ring-bg{fill:none;stroke:rgba(30,58,95,.12);stroke-width:3.5}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset .5s var(--ease)}
.ev-rsvp-t{display:flex;flex-direction:column;line-height:1.25}
.ev-rsvp-t b{font-size:.9rem;font-weight:600;color:var(--head)}
.ev-rsvp-t small,.ev-bal small{font-size:.74rem;color:var(--muted)}
.ev-state{grid-area:state;display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--fg);min-width:0;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.03)}
.dot.good{background:var(--good)} .dot.mid{background:var(--caution)} .dot.warn{background:var(--warn)} .dot.done{background:var(--faint)}
.ev-bal{grid-area:bal;display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.ev-bal b{font-size:.92rem;font-weight:600;color:var(--head)}
.ev-bal small.late{color:var(--warn);font-weight:500}
.chev{grid-area:chev;width:12px;height:12px;fill:none;stroke:var(--faint);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease),stroke .25s var(--ease)}
.ev:hover .chev{stroke:var(--accent);transform:translateX(-3px)}

/* ---------- attention rail ---------- */
.rail .item{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.rail .item:last-child{border-bottom:0}
.rail .item .t{font-size:.92rem;font-weight:400}
.rail .item .t a{text-decoration:none;border-bottom:1px solid var(--line-strong)}
.rail .item .d{grid-column:1;font-size:.8rem;color:var(--muted)}
.rail .item .act{grid-row:1 / span 2;grid-column:2}
.sev{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:8px;vertical-align:1px}
.sev.warn{background:var(--warn)} .sev.mid{background:var(--caution)}

/* ---------- event detail ---------- */
.back{display:inline-block;font-size:.88rem;color:var(--muted);text-decoration:none;margin-bottom:18px}
.back:hover{color:var(--fg)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line);margin-bottom:40px}
.fact{padding:16px 0;padding-inline-end:16px}
.fact+.fact{border-inline-start:1px solid var(--line);padding-inline-start:18px}
.fact .k{font-size:.78rem;color:var(--muted);}
.fact .v{font-size:1.5rem;font-weight:300;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.3}
.fact .s{font-size:.8rem;color:var(--muted)}
.contact{font-size:.9rem;color:var(--muted);margin-top:8px}
.contact b{font-weight:400;color:var(--fg);user-select:all}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line-strong);margin-bottom:40px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 0 12px;cursor:pointer;font-size:1rem;color:var(--faint);font-weight:400;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .25s var(--ease)}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.stat{padding:14px 8px}
.stat+.stat{border-inline-start:1px solid var(--line);padding-inline-start:16px}
.stat b{display:block;font-size:1.9rem;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.2;letter-spacing:-.02em}
.stat span{font-size:.8rem;color:var(--muted);}
.bar{height:6px;border-radius:2px;background:var(--bg2);overflow:hidden;display:flex;border:1px solid var(--line);gap:2px}
.bar i{display:block;height:100%}
.i-yes{background:var(--good)} .i-no{background:var(--warn)} .i-p{background:var(--faint)}
.legend-s{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:.81rem;color:var(--muted)}
.legend-s i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:6px;vertical-align:1px}
.note{font-size:.84rem;color:var(--muted);line-height:1.7}
.split2.wide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.split2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,3vw,36px);align-items:start}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;min-width:680px}
table.t th{font-size:.74rem;font-weight:500;color:var(--muted);text-align:start;padding:8px 10px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
table.t td{padding:15px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr:hover td{background:var(--accent-tint)}
table.t td .sub{display:block;font-size:.78rem;color:var(--muted)}
table.t tfoot td{font-weight:500;border-bottom:0;border-top:1px solid var(--line-strong)}
table.t a{text-decoration:none;border-bottom:1px solid var(--line-strong)}
.tcount{font-size:.82rem;color:var(--muted);margin-top:10px}

/* ---------- seating ---------- */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:18px}
.tbl{background-color:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px}
.tbl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tbl-top b{font-weight:500;font-size:.9rem}
.tbl-top span{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted)}
.tbl-top span.full{color:var(--accent);font-weight:500}
.seat-row{display:flex;gap:3px}
.seat-mark{flex:1;height:7px;border-radius:2px;background:var(--bg2);border:1px solid var(--line-strong)}
.seat-mark.on{background:var(--accent);border-color:var(--accent)}
.tbl .g{display:block;font-size:.74rem;color:var(--faint);margin-top:9px;}
.tbl .who{font-size:.8rem;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- seating editor (same system as the pitch) ---------- */
.seat-wrap{display:grid;gap:18px}
.pool{display:flex;flex-direction:column;gap:12px;min-height:40px;padding:4px 0}
.pool-h,.cons-h{font-size:.76rem;font-weight:500;color:var(--muted);margin-bottom:10px}
.cons-h{margin:20px 0 10px}
.pool-g{display:block}
.pool-gl{display:block;font-size:.76rem;color:var(--faint);margin-bottom:6px;}
.pool-gc{display:flex;flex-wrap:wrap;gap:6px}
.chip.hh{font-size:.86rem;padding:.25em .75em;display:inline-flex;align-items:center;gap:6px}
.chip.hh small{opacity:.65;font-variant-numeric:tabular-nums;margin:0}
.chip[draggable="true"]{cursor:grab}
.chip.seated{background:var(--accent-tint);border-color:transparent;font-size:.82rem}
.chip.seated[aria-pressed="true"],.chip.hh[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.dragging{opacity:.4}
.pool-card.over{outline:1.5px dashed var(--accent);outline-offset:-6px}
.cons-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.con{display:inline-flex;align-items:center;gap:8px;font-size:.84rem;border:1px solid var(--line-strong);border-radius:6px;padding:.3em .7em}
.con.no{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.con button{border:0;background:transparent;cursor:pointer;color:inherit;font-size:1.05rem;line-height:1;opacity:.55;padding:0}
.con button:hover{opacity:1}
.con-bad{color:var(--warn);font-weight:500}
.con-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.con-add select{border:1px solid var(--line-strong);background:var(--card);color:var(--fg);border-radius:6px;padding:.4em .55em;font-size:.86rem;max-width:100%}
.seat-acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.msg{min-height:1.6em;color:var(--muted);font-size:.9rem}
.tbl[data-t]{transition:border-color .2s var(--ease),background-color .2s var(--ease)}
.tbl.over{border-color:var(--accent);background-color:var(--accent-tint)}
.tbl.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.tbl-target{display:block;width:100%;border:0;background:transparent;cursor:pointer;padding:8px;margin:-8px -8px 8px;border-radius:5px;text-align:start;width:calc(100% + 16px)}
.tbl-target:hover{background:var(--accent-tint)}
.tbl-top span.over{color:var(--warn);font-weight:500}
.tbl .names{display:flex;flex-wrap:wrap;gap:5px;min-height:28px;align-items:center}
.tbl.editing{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tedit{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tedit-acts{display:flex;justify-content:space-between;gap:12px;font-size:.84rem}
.tedit-acts .linkbtn{font-size:.84rem}

.pill{background:rgba(126,168,216,.14);border-color:rgba(126,168,216,.28);color:#4A5A70}

  for(var at=start; at<-2; at+=3+Math.floor(r()*4)){
    if(EVENT_SEED.some(function(x){return Math.abs(x.at-at)<5;})) continue;   /* leave room around the hand-written events */
    var k=r(), kind=k<.86?'חתונה':k<.93?'בר מצווה':'בת מצווה';
    var f1=FIRST[Math.floor(r()*FIRST.length)], f2=FIRST[Math.floor(r()*FIRST.length)];
    if(f2===f1) f2=FIRST[(FIRST.indexOf(f1)+7)%FIRST.length];
    var inv=150+Math.round(r()*20)*10; n++;
    out.push(gen(r,'h',n,at,inv,kind,f1,f2));
  }
  /* bookings further ahead: deposits already taken, guest lists not started */
  for(at=100, n=0; at<=280; at+=3+Math.floor(r()*4)){
    k=r(); kind=k<.86?'חתונה':k<.93?'בר מצווה':'בת מצווה';

function startOfDay(d){var x=new Date(d); x.setHours(0,0,0,0); return x;}
var TODAY = startOfDay(new Date());
function addDays(d,n){var x=new Date(d); x.setDate(x.getDate()+n); return x;}
function daysBetween(a,b){return Math.round((startOfDay(b)-startOfDay(a))/86400000);}
function sameMonth(d,y,m){return d.getFullYear()===y && d.getMonth()===m;}
function round100(n){return Math.round(n/100)*100;}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return Math.round(n).toLocaleString('he-IL');}
function money(n){return fmt(n)+' ₪';}
function moneyK(n){var a=Math.abs(n); return a>=1e6 ? (n/1e6).toFixed(1).replace('.0','')+'M' : Math.round(n/1000)+'K';}
function pct(a,b){return b? Math.round(a/b*100) : 0;}
function dShort(d){return d.getDate()+'.'+(d.getMonth()+1);}
function dLong(d){return d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});}
function dMonth(d){return d.toLocaleDateString('he-IL',{month:'short'});}
function dWeekday(d){return d.toLocaleDateString('he-IL',{weekday:'short'});}
function monthLabel(y,m){return new Date(y,m,1).toLocaleDateString('he-IL',{month:'long',year:'numeric'});}
function monthShort(y,m){return new Date(y,m,1).toLocaleDateString('he-IL',{month:'short'});}
function rel(d){
  var n=daysBetween(TODAY,d);
  if(n===0) return 'היום'; if(n===1) return 'מחר'; if(n===-1) return 'אתמול';
  return n>0 ? 'בעוד '+n+' ימים' : 'לפני '+(-n)+' ימים';
}
function isoDate(d){var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function parseIso(s){var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]);}
function rng(seed){return function(){seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296;};}
/* ids must stay unique across reloads and devices, so no counter */
function nextId(p){return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function build(){
  emptyState();
  EVENT_SEED.concat(historySeeds()).forEach(function(seed, idx){
    var ev = Object.assign({}, seed);
    ev.date = addDays(TODAY, seed.at);
    var past = seed.at < 0;
    var answered = past ? 1 : seed.answered, yes = past ? .86 : seed.yes, seatedShare = past ? 1 : seed.seated;
    ev.sides = SIDES[ev.kind] || SIDES['חתונה'];
    ev.households = makeHouseholds(ev, idx+11, answered, yes);
    seatHouseholds(ev, seatedShare);
    ev.cons = defaultCons(ev);
    S.events.push(ev);
    addSchedule(ev, true, idx);
    addBills(ev, true);
  });

  EXTRA_PAYMENTS.forEach(function(x, i){
    var ev = eventById(x.eventId), due = addDays(ev.date, x.offset);
    S.payments.push({id:'x'+i, eventId:x.eventId, type:x.type, note:x.note, amount:x.amount, due:due,
      paidDate: due<TODAY ? due : null, method:x.method});
  });

  for(var m=-(12+TODAY.getMonth()); m<=11-TODAY.getMonth(); m++){
    var y = TODAY.getFullYear(), mo = TODAY.getMonth()+m, dim = new Date(y, mo+1, 0).getDate();
    EXPENSE_ITEMS.forEach(function(it){
      var date = new Date(y, mo, Math.min(it.day, dim)), key = 'm'+m+'-'+it.id;
      var amount = it.amount + (it.vary ? it.vary[((m%it.vary.length)+it.vary.length)%it.vary.length] : 0);
      S.expenses.push({id:key, tpl:it.id, cat:it.cat, desc:it.desc, amount:amount, date:date,
        paidDate:(date<TODAY && OVERRIDES[key]!=='late') ? date : null});
    });
  }
  ONE_OFF_EXPENSES.forEach(function(o, i){
    var date = new Date(TODAY.getFullYear(), TODAY.getMonth()+o.month, o.day);
    S.expenses.push({id:'o'+i, cat:o.cat, desc:o.desc, amount:o.amount, date:date, paidDate: date<TODAY ? date : null});
  });
}

function makeHouseholds(ev, seed, answered, yes){
  var r = rng(seed), list = [], people = 0, sides = ev.sides;
  while(people < ev.invited){
    var x = r(), size = x<.2 ? 1 : x<.62 ? 2 : x<.74 ? 3 : x<.9 ? 4 : 5;
    size = Math.min(size, ev.invited-people);
    var sur = SURNAMES[Math.floor(r()*SURNAMES.length)], f1 = FIRST[Math.floor(r()*FIRST.length)], f2 = FIRST[Math.floor(r()*FIRST.length)];
    if(f2===f1) f2 = FIRST[(FIRST.indexOf(f1)+5)%FIRST.length];
    var name = size===1 ? f1+' '+sur : size===2 ? f1+' ו'+f2+' '+sur : 'משפחת '+sur;
    var side = sides[Math.min(sides.length-1, Math.floor(Math.pow(r(),1.3)*sides.length))];
    var a = r(), status = a < yes ? 'y' : a < answered ? 'n' : 'p';
    list.push({id:ev.id+'-'+list.length, name:name, side:side, size:size, status:status, table:-1});
    people += size;
  }
  return list;
}

/* the hall's payment schedule for one event; auto = mark past-due rows as paid (initial demo data) */
function addSchedule(ev, auto, idx){
  var total = ev.plates*ev.perPlate, used = 0;
  SCHEDULE.forEach(function(s, k){
    var amt = k===SCHEDULE.length-1 ? total-used : round100(total*s.share); used += amt;
    var due = addDays(ev.date, s.offset), key = ev.id+'-'+s.key;
    var late = OVERRIDES[key]==='late';
    S.payments.push({id:key, sched:s.key, eventId:ev.id, type:s.type, note:'', amount:amt, due:due,
      paidDate:(auto && due<TODAY && !late) ? due : null, method:(s.key==='int' && (idx||0)%2) ? 'העברה בנקאית' : s.method});
  });
}

/* one bill per vendor for an event; auto = demo data, past-due bills count as paid */
function addBills(ev, auto){
  VENDORS.forEach(function(v){
    var amount = v.perPlate ? v.perPlate*ev.plates : v.fixed;
    var due = addDays(ev.date, v.terms), key = ev.id+'-'+v.id, o = auto ? OVERRIDES[key] : 'late';
    var paid = 0, paidDate = null;
    if(o && o.part){ paid = round100(amount*o.part); paidDate = addDays(ev.date,-14); }
    else if(due<TODAY && o!=='late'){ paid = amount; paidDate = due; }
    S.bills.push({id:key, vendorId:v.id, eventId:ev.id, desc:v.service+' לאירוע', amount:amount, paid:paid, due:due, paidDate:paidDate});
  });
}
/* one row per fixed expense per month (or once a year), from this month to December; ids hold the calendar month so they survive reloads */
function fillMonthly(it){
  var y=TODAY.getFullYear();
  for(var mo=TODAY.getMonth(); mo<12; mo++){
    if(it.freq==='year' && mo!==it.month) continue;   /* yearly: paid once, in its month */
    var id=it.id+'-'+y+'-'+mo, dim=new Date(y,mo+1,0).getDate();
    if(!findById(S.expenses,id)) S.expenses.push({id:id, tpl:it.id, cat:it.cat, desc:it.desc, amount:it.amount, date:new Date(y,mo,Math.min(it.day,dim)), paidDate:null, yearly:it.freq==='year'||undefined});
  }
}

function newHallData(meta){

function setSync(text, bad){ var s=$('#sync'); s.hidden=false; s.textContent=text; s.classList.toggle('bad',!!bad); }
function scheduleSave(){ if(!db || !hall) return;   /* never save before the venue has loaded */ clearTimeout(saveT); saveT=setTimeout(save,600); }
function save(){
  saveT=null;
  if(saving){ scheduleSave(); return; }   /* one save at a time, or the version check trips on our own write */
  var snap=snapshot(); if(snap===lastSaved) return;
  saving=true; setSync('שומר…');
  db.from('halls').update({data:JSON.parse(snap), version:hall.version+1, updated_at:new Date().toISOString()})
    .eq('id',hall.id).eq('version',hall.version).select('version')
    .then(function(r){
      saving=false;
      if(r.error){ saveFailed=true; setSync('לא נשמר · מנסה שוב',true); saveT=setTimeout(save,5000); return; }
      if(!r.data.length){   /* someone saved from another device since we loaded */
        saveFailed=true; setSync('לא נשמר',true);
        alert('הנתונים עודכנו ממכשיר אחר. הדף ייטען מחדש עם הגרסה העדכנית, והשינוי האחרון כאן לא נשמר.');
        location.reload(); return;
      }
      hall.version=r.data[0].version; lastSaved=snap; saveFailed=false; setSync('נשמר');
    }, function(){ saving=false; saveFailed=true; setSync('לא נשמר · מנסה שוב',true); saveT=setTimeout(save,5000); });
}
function unsaved(){ return db && (saveT || saving || saveFailed); }

/* ---------- seating: tables are numbered 1..ev.tableCount, each household knows its table ---------- */
function hhSize(u){return u.reduce(function(a,h){return a+h.size;},0);}
function hhById(ev,id){for(var i=0;i<ev.households.length;i++) if(ev.households[i].id===id) return ev.households[i]; return null;}
function missing(n){ return n===1 ? 'חסר מקום אחד' : 'חסרים '+n+' מקומות'; }
function capOf(ev,n){ return (ev.tableCaps && ev.tableCaps[n]) || HALL.tableCap; }
function tablesOf(ev){
  var t=[]; for(var i=1;i<=ev.tableCount;i++) t.push({n:i,cap:capOf(ev,i),count:0,hh:[],sides:[]});
  ev.households.forEach(function(h){ if(h.table>0 && t[h.table-1]){ var T=t[h.table-1]; T.count+=h.size; T.hh.push(h); if(T.sides.indexOf(h.side)<0) T.sides.push(h.side);} });
  return t;
}
function noConflict(unit, tableHH, cons){
  return !cons.some(function(c){
    if(c.t!=='no') return false;
    var ua=unit.some(function(h){return h.id===c.a;}), ub=unit.some(function(h){return h.id===c.b;});
    if(ua&&ub) return true;
    return (ua && tableHH.some(function(h){return h.id===c.b;})) || (ub && tableHH.some(function(h){return h.id===c.a;}));
  });
}
/* best-fit placement: same side first, then an empty or new table, then a mixed table; returns how many units did not fit */
function placeUnits(ev, units, cons){
  var cap=HALL.tableCap, tables=tablesOf(ev), failed=0;   /* cap = seats of a new table */
  units.sort(function(a,b){ return ev.sides.indexOf(a[0].side)-ev.sides.indexOf(b[0].side) || hhSize(b)-hhSize(a); });
  units.forEach(function(u){
    var size=hhSize(u), side=u[0].side, best=-1, bestScore=-1e9, bestKind='';
    var partnerT=-1;
    cons.forEach(function(c){ if(c.t!=='yes') return; u.forEach(function(h){ var o = c.a===h.id ? hhById(ev,c.b) : c.b===h.id ? hhById(ev,c.a) : null; if(o && o.table>0 && u.indexOf(o)<0) partnerT=o.table; }); });
    tables.forEach(function(T, i){
      if(T.count+size>T.cap || !noConflict(u,T.hh,cons)) return;
      var same=T.sides.indexOf(side)>=0, left=T.cap-T.count-size;
      var kind = T.count===0 ? 'empty' : same ? 'same' : 'mixed';
      var score = (i+1===partnerT?5000:0) + (kind==='empty' ? 500 : kind==='same' ? 1000 : 100) - left;
      if(score>bestScore){bestScore=score; best=i; bestKind=kind;}
    });
    /* open a new table only when nothing fits, or the only option is mixing sides; existing empty tables are used first */
    if((best<0 || (bestKind==='mixed' && bestScore<5000)) && tables.length<HALL.maxTables && size<=cap && partnerT<0){
      ev.tableCount=tables.length+1; tables.push({n:tables.length+1,cap:capOf(ev,tables.length+1),count:0,hh:[],sides:[]}); best=tables.length-1;
    }
    if(best<0){ failed++; return; }
    var T=tables[best]; u.forEach(function(h){ h.table=T.n; T.count+=h.size; T.hh.push(h); if(T.sides.indexOf(h.side)<0) T.sides.push(h.side); });
  });
  return failed;
}
function seatHouseholds(ev, share){
  var yesList = ev.households.filter(function(h){return h.status==='y';});
  ev.households.forEach(function(h){h.table=-1;});
  ev.tableCount = 0; ev.tableCaps = {};
  yesList.sort(function(a,b){return ev.sides.indexOf(a.side)-ev.sides.indexOf(b.side);});
  placeUnits(ev, yesList.slice(0, Math.round(yesList.length*share)).map(function(h){return [h];}), []);
}
function defaultCons(ev){
  if(ev.at<0) return [];
  var y=ev.households.filter(function(h){return h.status==='y';});
  return y.length<10 ? [] : [{a:y[1].id, b:y[4].id, t:'no'}];
}
function conBroken(ev,c){
  var a=hhById(ev,c.a), b=hhById(ev,c.b); if(!a||!b||a.table<0||b.table<0) return false;
  return c.t==='no' ? a.table===b.table : a.table!==b.table;
}

/* =====================================================================
   4. DERIVED NUMBERS
   ===================================================================== */
function eventById(id){for(var i=0;i<S.events.length;i++) if(S.events[i].id===id) return S.events[i]; return null;}
function vendorById(id){for(var i=0;i<VENDORS.length;i++) if(VENDORS[i].id===id) return VENDORS[i]; return null;}
function payStatus(p){return p.paidDate ? 'paid' : (p.due<TODAY ? 'late' : 'due');}
function billOpen(b){return b.amount-b.paid;}
function billStatus(b){return b.paid>=b.amount ? 'paid' : (b.due<TODAY ? 'late' : (b.paid>0 ? 'partial' : 'due'));}
function expStatus(e){return e.paidDate ? 'paid' : (e.date<TODAY ? 'late' : 'due');}
function isPast(ev){return ev.date<TODAY;}

function rsvp(ev){
  var o={yes:0,no:0,pend:0,hYes:0,hNo:0,hPend:0,seated:0,seatedH:0};
  ev.households.forEach(function(h){
    if(h.status==='y'){o.yes+=h.size;o.hYes++; if(h.table>0){o.seated+=h.size;o.seatedH++;}}
    else if(h.status==='n'){o.no+=h.size;o.hNo++;} else {o.pend+=h.size;o.hPend++;}
  });
  o.total=o.yes+o.no+o.pend; o.households=ev.households.length;
  o.answeredPct = pct(o.hYes+o.hNo, o.households);
  o.unseated=o.yes-o.seated;
  return o;
}
function seatingState(ev){
  if(isPast(ev)) return 'done';
  var r=rsvp(ev); if(r.yes===0 || r.seated===0) return 'none';
  return r.unseated===0 ? 'ready' : 'partial';
}
function eventMoney(ev){
  var o={total:0,paid:0,open:0,late:0,rows:[]};
  S.payments.forEach(function(p){
    if(p.eventId!==ev.id) return;
    o.rows.push(p); o.total+=p.amount;
    var st=payStatus(p); if(st==='paid') o.paid+=p.amount; else { o.open+=p.amount; if(st==='late') o.late+=p.amount; }
  });
  o.rows.sort(function(a,b){return a.due-b.due;});
  o.costs = S.bills.filter(function(b){return b.eventId===ev.id;});
  o.cost = o.costs.reduce(function(a,b){return a+b.amount;},0);
  return o;
}
function eventFlags(ev){
  var f=[], m=eventMoney(ev), r=rsvp(ev), n=daysBetween(TODAY,ev.date);
  if(m.late>0) f.push({sev:'warn', text:'תשלום באיחור'});
  if(n>=0 && n<=14 && seatingState(ev)!=='ready') f.push({sev:'mid', text:'הושבה לא הושלמה'});
  if(n>=0 && n<=21 && r.answeredPct<70) f.push({sev:'mid', text:'רק '+r.answeredPct+'% ענו'});
  return f;
}
function monthRange(y,m){var f=new Date(y,m,1); return {from:f, to:new Date(y,m+1,1), label:monthLabel(f.getFullYear(),f.getMonth()), short:monthShort(f.getFullYear(),f.getMonth())};}
function quarterRange(y,q){return {from:new Date(y,q*3,1), to:new Date(y,q*3+3,1), label:'רבעון '+(q+1)+' · '+monthShort(y,q*3)+'–'+monthLabel(y,q*3+2), short:'רבעון '+(q+1)};}
function yearRange(y){return {from:new Date(y,0,1), to:new Date(y+1,0,1), label:'שנת '+y, short:String(y)};}
function selRange(){var u=S.ui; return u.pkind==='year'? yearRange(u.selY) : u.pkind==='quarter'? quarterRange(u.selQ.y,u.selQ.q) : monthRange(u.selM.y,u.selM.m);}
var DATA_END = addDays(TODAY,100);
function isNarrow(){return window.innerWidth<600;}
function inRange(d,r){return d>=r.from && d<r.to;}
function moneyIn(r){
  var o={total:0,paid:0};
  S.payments.forEach(function(p){ if(inRange(p.due,r)){ o.total+=p.amount; if(p.paidDate) o.paid+=p.amount; } });
  return o;
}
function moneyOut(r){
  var o={total:0,paid:0,cats:{}};
  function add(cat,amt,paid){o.total+=amt; o.paid+=paid; o.cats[cat]=(o.cats[cat]||0)+amt;}
  S.bills.forEach(function(b){ if(inRange(b.due,r)) add(vendorById(b.vendorId).service, b.amount, b.paid); });
  S.expenses.forEach(function(e){ if(inRange(e.date,r)) add(e.cat, e.amount, e.paidDate?e.amount:0); });
  return o;
}
function attention(){
  var items=[];
  S.payments.forEach(function(p){ if(payStatus(p)==='late'){ var ev=eventById(p.eventId);
    items.push({sev:'warn', order:0, due:p.due, html:'<span class="t"><span class="sev warn"></span><a href="#event-'+ev.id+'">'+esc(ev.title)+'</a> · '+esc(p.type)+'</span><span class="d">'+money(p.amount)+' · באיחור של '+(-daysBetween(TODAY,p.due))+' ימים</span><span class="act"><button type="button" class="small-btn" data-pay="'+p.id+'">סמן כשולם</button></span>'}); } });
  S.bills.forEach(function(b){ if(billStatus(b)==='late'){ var v=vendorById(b.vendorId), ev=eventById(b.eventId);
    items.push({sev:'warn', order:1, due:b.due, html:'<span class="t"><span class="sev warn"></span>תשלום לספק · '+esc(v.name)+'</span><span class="d">'+money(billOpen(b))+' · '+(ev?esc(ev.title)+' · ':'')+'באיחור של '+(-daysBetween(TODAY,b.due))+' ימים</span><span class="act"><button type="button" class="small-btn" data-bill="'+b.id+'">סמן כשולם</button></span>'}); } });
  S.expenses.forEach(function(e){ if(expStatus(e)==='late'){
    items.push({sev:'warn', order:2, due:e.date, html:'<span class="t"><span class="sev warn"></span>הוצאה שוטפת · '+esc(e.desc)+'</span><span class="d">'+money(e.amount)+' · מועד '+dShort(e.date)+'</span><span class="act"><button type="button" class="small-btn" data-exp="'+e.id+'">סמן כשולם</button></span>'}); } });
  upcoming().forEach(function(ev){
    var n=daysBetween(TODAY,ev.date), r=rsvp(ev), st=seatingState(ev);
    if(n<=14 && st!=='ready') items.push({sev:'mid', order:3, due:ev.date, html:'<span class="t"><span class="sev mid"></span>הושבה · <a href="#event-'+ev.id+'">'+esc(ev.title)+'</a></span><span class="d">האירוע '+rel(ev.date)+' · '+r.unseated+' אורחים ממתינים לשיבוץ</span>'});
    if(n<=21 && r.answeredPct<70) items.push({sev:'mid', order:4, due:ev.date, html:'<span class="t"><span class="sev mid"></span>אישורי הגעה · <a href="#event-'+ev.id+'">'+esc(ev.title)+'</a></span><span class="d">רק '+r.answeredPct+'% מהמוזמנים ענו · האירוע '+rel(ev.date)+'</span>'});
  });
  items.sort(function(a,b){return a.order-b.order || a.due-b.due;});
  return items;
}
function upcoming(){return S.events.filter(function(e){return !isPast(e);}).sort(function(a,b){return a.date-b.date;});}

function payPill(st){return st==='paid'?'<span class="pill yes">שולם</span>':st==='late'?'<span class="pill no">באיחור</span>':st==='partial'?'<span class="pill mid">שולם חלקית</span>':'<span class="pill">צפוי</span>';}
function seatPill(ev){
  var st=seatingState(ev), n=daysBetween(TODAY,ev.date);
  if(st==='done') return '<span class="pill">האירוע התקיים</span>';
  if(st==='ready') return '<span class="pill yes">הושבה מוכנה</span>';

  return '<span class="pill'+(n<=14?' mid':'')+'">הושבה טרם התחילה</span>';

/* progress ring, like the Activity rings: share of invited households that answered */
function ring(p){

  return '<svg class="ring" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" class="ring-bg"/>'+
    '<circle cx="14" cy="14" r="11" class="ring-fg" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" transform="rotate(-90 14 14)"/></svg>';
}
/* one status per event: the most urgent thing wins */
function evState(ev){
  var m=eventMoney(ev), f=eventFlags(ev);

  if(f.length) return ['mid', f[0].text];
  if(isPast(ev)) return ['done', m.open>0 ? 'יתרה פתוחה' : 'הסתיים'];

}

      '<div class="card closed-list"><div><h2 class="sec" style="font-size:1rem">רשימת המוזמנים</h2><p class="note">'+(r.households? r.households+' משפחות · '+r.total+' מוזמנים.' : 'הרשימה ריקה. העלו קובץ אקסל, CSV או וורד עם שם וכמות לכל משפחה.')+'</p></div>'+

function tSeating(ev,r){

  function marks(c,n){var h=''; for(var i=0;i<n;i++) h+='<i class="seat-mark'+(i<c?' on':'')+'"></i>'; return h;}
  function sidesLabel(t){return t.sides.length? '<span class="g">'+(t.sides.length===1?esc(t.sides[0]):'מעורב · '+t.sides.map(esc).join(', '))+'</span>' : '';}

    return head+'<p class="note" style="margin-bottom:22px">סידור ההושבה כפי שהיה באירוע.</p><div class="tables">'+tables.filter(function(t){return t.count;}).map(function(t){
      return '<div class="tbl"><div class="tbl-top"><b>שולחן '+t.n+'</b><span class="'+(t.count>=t.cap?'full':'')+'">'+t.count+'/'+t.cap+'</span></div><div class="seat-row">'+marks(t.count,t.cap)+'</div>'+sidesLabel(t)+'<span class="who">'+t.hh.map(function(h){return esc(h.name);}).join(' · ')+'</span></div>';
    }).join('')+'</div>';
  }
  function chip(h,seated){return '<button type="button" draggable="true" class="chip hh'+(seated?' seated':'')+'" data-hh="'+h.id+'" aria-pressed="'+(sel===h.id)+'" title="'+esc(h.side)+'">'+esc(h.name)+'<small>'+h.size+'</small></button>';}
  var pool=ev.households.filter(function(h){return h.status==='y' && h.table<0;});
  var poolHtml = pool.length ? ev.sides.map(function(sd){
    var mem=pool.filter(function(h){return h.side===sd;});
    return mem.length? '<span class="pool-g"><span class="pool-gl">'+esc(sd)+' · '+hhSize(mem)+' אורחים</span><span class="pool-gc">'+mem.map(function(h){return chip(h,false);}).join('')+'</span></span>' : '';
  }).join('') : '<span class="empty" style="padding:0">כל מי שאישר הגעה משובץ לשולחן.</span>';
  var yes=ev.households.filter(function(h){return h.status==='y';}).sort(function(a,b){return a.name.localeCompare(b.name,'he');});
  var cons='<div class="cons-h">אילוצי ישיבה</div><div class="cons-list">'+(ev.cons.length? ev.cons.map(function(c,i){
      var a=hhById(ev,c.a), b=hhById(ev,c.b), broken=conBroken(ev,c);
      return '<span class="con'+(c.t==='no'?' no':'')+'">'+esc(a?a.name:'?')+(c.t==='no'?' ✕ ':' + ')+esc(b?b.name:'?')+(broken?' <b class="con-bad">לא מכובד</b>':'')+'<button type="button" data-delcon="'+i+'" aria-label="מחיקת אילוץ">×</button></span>';
    }).join('') : '<span class="empty" style="padding:0">אין אילוצים</span>')+'</div>'+
    (S.ui.conOpen ? '<div class="con-add"><select id="ca" aria-label="משפחה ראשונה">'+yes.map(function(h){return opt(h.id,h.name);}).join('')+'</select>'+

      '<select id="cb" aria-label="משפחה שנייה">'+yes.map(function(h,i){return opt(h.id,h.name,i===1);}).join('')+'</select>'+
      '<button type="button" class="small-btn primary" data-seatact="addcon">הוספה</button><button type="button" class="small-btn" data-seatact="opencon">ביטול</button></div>'
    : '<button type="button" class="small-btn" data-seatact="opencon">+ אילוץ חדש</button>');
  var acts='<div class="seat-acts">'+
    (selH && selH.table>0 ? '<button type="button" class="small-btn" data-seatact="unseat">החזרת '+esc(selH.name)+' לרשימה</button>' : '')+

    '<button type="button" class="small-btn" data-seatact="clear">ניקוי ההושבה</button></div>'+
    (S.ui.addTblOpen ? '<div class="con-add addtbl"><label for="nt-cap">מושבים בשולחן החדש</label><input id="nt-cap" type="number" min="1" max="40" step="1" inputmode="numeric" value="'+cap+'">'+
      '<button type="button" class="small-btn primary" data-seatact="addtable-ok">הוספת שולחן '+(ev.tableCount+1)+'</button><button type="button" class="small-btn" data-seatact="addtable">ביטול</button></div>' : '');
  var grid='<div class="tables">'+tables.map(function(t){
    var over=t.count>t.cap, bad=t.hh.some(function(h){return ev.cons.some(function(c){return c.t==='no' && conBroken(ev,c) && (c.a===h.id||c.b===h.id);});});

      '<div class="names">'+(t.hh.length? t.hh.map(function(h){return chip(h,true);}).join('') : '<span class="empty" style="padding:0">שולחן ריק</span>')+'</div>'+sidesLabel(t)+

    '<div class="msg" aria-live="polite">'+msg+'</div>'+grid+'</div>';

/* desktop: the 12 months of the selected year. phone: fewer, wider bars */
function chartMonths(){
  var u=S.ui, r=selRange(), y=r.from.getFullYear(), list=[], i;
  if(!isNarrow()){ for(i=0;i<12;i++) list.push(monthRange(y,i)); }
  else if(u.pkind==='year'){ for(i=0;i<4;i++) list.push(quarterRange(y,i)); }
  else if(u.pkind==='quarter'){ for(i=0;i<3;i++) list.push(monthRange(y,r.from.getMonth()+i)); }
  else { for(i=-2;i<=0;i++) list.push(monthRange(y,r.from.getMonth()+i)); }
  return list.map(function(b){
    var inc=moneyIn(b), o=moneyOut(b);
    return {label:b.short, full:b.label, inP:b.from>=r.from && b.to<=r.to, inc:inc.total, incPaid:inc.paid, out:o.total, outPaid:o.paid};
  });
}
function niceMax(v){var p=Math.pow(10,Math.floor(Math.log10(v||1))), n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function topBar(x,y,w,h,r){ if(h<=0) return ''; r=Math.min(r,h); return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z'; }
function chartSvg(period){
  var data=chartMonths(), narrow=isNarrow(), W=narrow?360:640, H=narrow?220:250, padL=4, padR=narrow?40:46, padT=12, padB=30;
  var max=niceMax(Math.max.apply(null,data.map(function(d){return Math.max(d.inc,d.out);}))*1.05);
  var ih=H-padT-padB, iw=W-padL-padR, gw=iw/data.length, bw=Math.min(narrow?26:22,gw*.28), gap=2;
  function Y(v){return padT+ih-(v/max)*ih;}
  /* months run right-to-left to follow the RTL reading order */
  function GX(i){return padL+iw-(i+1)*gw;}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="הכנסות מול הוצאות לפי חודש">'+
    '<defs><pattern id="hatch-in" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><rect width="5" height="5" style="fill:var(--card)"/><rect width="2" height="5" style="fill:var(--c-in)"/></pattern>'+
    '<pattern id="hatch-out" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><rect width="5" height="5" style="fill:var(--card)"/><rect width="2" height="5" style="fill:var(--c-out)"/></pattern></defs>';
  for(var t=0;t<=4;t++){var v=max*t/4, yy=Y(v);
    s+='<line class="'+(t===0?'base':'grid')+'" x1="'+padL+'" x2="'+(padL+iw)+'" y1="'+yy+'" y2="'+yy+'"/>';
    s+='<text x="'+(W-4)+'" y="'+(yy+4)+'" text-anchor="end">'+(t===0?'0':moneyK(v))+'</text>';
  }
  data.forEach(function(d,i){
    var inP=d.inP, op=inP?1:.38, cx=GX(i)+gw/2;
    var x1=cx+gap/2, x2=cx-gap/2-bw;   /* income on the right, expenses on the left */
    function stack(x,total,paid,fill,hatch){
      var yPaid=Y(paid), yTot=Y(total), str='';
      if(paid>0) str+='<path d="'+(total>paid? 'M'+x+','+Y(0)+'V'+yPaid+'H'+(x+bw)+'V'+Y(0)+'Z' : topBar(x,yPaid,bw,Y(0)-yPaid,3))+'" style="fill:'+fill+'"/>';
      if(total>paid) str+='<path d="'+topBar(x,yTot,bw,Math.max(0,yPaid-yTot-(paid>0?2:0)),3)+'" style="fill:url(#'+hatch+');stroke:'+fill+'" stroke-width="1"/>';
      return str;
    }
    s+='<g opacity="'+op+'">'+stack(x1,d.inc,d.incPaid,'var(--c-in)','hatch-in')+stack(x2,d.out,d.outPaid,'var(--c-out)','hatch-out')+'</g>';
    s+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" style="'+(inP?'fill:var(--fg);font-weight:500':'')+'">'+d.label+'</text>';
    s+='<rect class="hit" data-i="'+i+'" x="'+GX(i)+'" y="'+padT+'" width="'+gw+'" height="'+ih+'" style="fill:transparent"/>';
  });
  return s+'</svg>';
}

function wireChart(){

      '<div class="r"><span>הוצאות</span>'+money(d.out)+'</div><div class="r"><span>מתוכן שולמו</span>'+money(d.outPaid)+'</div>'+
      '<div class="r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>נטו</span>'+(n<0?'−':'')+money(Math.abs(n))+'</div>';
    var tw=tip.offsetWidth||200, left=hb.left-box.left+hb.width/2-tw/2; left=Math.max(0,Math.min(left,box.width-tw));
    tip.style.left=left+'px'; tip.style.top='8px'; tip.classList.add('on');
  }
  c.addEventListener('mousemove',show);

  c.addEventListener('mouseleave',function(){tip.classList.remove('on');});
}

var toastTimer=null, undoFn=null;
function toast(text, undo){
  $('#toast-t').textContent=text; undoFn=undo||null;
  $('#toast-undo').hidden=!undo;
  $('#toast').classList.add('on'); clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){$('#toast').classList.remove('on'); undoFn=null;},5000);
}
function findById(arr,id){for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null;}

function markPay(id){
  var p=findById(S.payments,id); if(!p||p.paidDate) return;
  p.paidDate=TODAY; render(true);
  toast(eventById(p.eventId).title+' · '+p.type+' סומן כשולם ('+money(p.amount)+')', function(){p.paidDate=null; render(true);});
}
function markBill(id){
  var b=findById(S.bills,id); if(!b) return;
  var prev={paid:b.paid,paidDate:b.paidDate}; b.paid=b.amount; b.paidDate=TODAY; render(true);
  toast('התשלום ל'+vendorById(b.vendorId).name+' סומן כשולם', function(){b.paid=prev.paid; b.paidDate=prev.paidDate; render(true);});
}

/* ---------- pricing: change plates or price per plate of one event ---------- */
function setEventPricing(ev, plates, pp){
  var diff=plates*pp - ev.plates*ev.perPlate, created=null;
  ev.plates=plates; ev.perPlate=pp;
  if(diff){
    var open=S.payments.filter(function(p){return p.eventId===ev.id && p.sched && !p.paidDate;}).sort(function(a,b){return a.due-b.due;});
    var last=open[open.length-1];
    if(last && last.amount+diff>=0) last.amount+=diff;
    else { created={id:nextId('p'), eventId:ev.id, type:diff>0?'התאמת מחיר':'זיכוי', note:'שינוי במנות או במחיר למנה', amount:diff, due:ev.date<TODAY?TODAY:ev.date, paidDate:null, method:'העברה בנקאית'}; S.payments.push(created); }
  }
  S.bills.forEach(function(b){ if(b.eventId===ev.id && b.paid===0){ var v=vendorById(b.vendorId); if(v && v.perPlate!=null) b.amount=v.perPlate*ev.plates; } });
  return {diff:diff, created:created};
}
function reschedule(ev){
  S.payments=S.payments.filter(function(p){return !(p.eventId===ev.id && p.sched);});
  addSchedule(ev, false, 0);
}

/* ---------- inline edits ---------- */
function startEdit(btn){
  var type=btn.dataset.type, inp=document.createElement('input');
  inp.type = type==='date' ? 'date' : 'number';
  if(type!=='date'){ inp.min='0'; inp.step='1'; inp.inputMode='numeric'; }
  inp.value=btn.dataset.raw; inp.className='edin'; inp.setAttribute('aria-label','עריכה');
  var key=btn.dataset.ed, done=false;
  btn.replaceWith(inp); inp.focus(); if(type!=='date'){ try{inp.select();}catch(_){} }
  function finish(save){ if(done) return; done=true; if(save && inp.value!==btn.dataset.raw) applyEdit(key, inp.value); else render(true); }
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); finish(true); } else if(e.key==='Escape'){ e.preventDefault(); finish(false); } });
  inp.addEventListener('blur',function(){ finish(true); });
}
function applyEdit(key, raw){
  var p=key.split(':'), kind=p[0], f=p[1], id=p.slice(2).join(':');
  var isDate = f==='due' || f==='date';
  var v = isDate ? (raw ? parseIso(raw) : null) : Math.round(parseFloat(raw));

/* ---------- guest list import (Excel / CSV / Word) ---------- */
/* parsers load only when a file is picked */
var LIBS={xlsx:'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', mammoth:'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js'};
function loadLib(src, name){
  if(window[name]) return Promise.resolve();
  return new Promise(function(ok,no){ var t=document.createElement('script'); t.src=src; t.onload=ok; t.onerror=function(){no(new Error('לא הצלחנו לטעון את קורא הקבצים. בדקו את החיבור לאינטרנט.'));}; document.head.appendChild(t); });
}
/* any supported file -> rows of cell strings */
function readGuestFile(file){
  var ext=(file.name.split('.').pop()||'').toLowerCase();
  if(file.size>5e6) return Promise.reject(new Error('הקובץ גדול מדי (מעל 5MB).'));
  if(ext==='doc') return Promise.reject(new Error('קובץ וורד ישן (doc) לא נתמך. שמרו אותו כ-docx ונסו שוב.'));
  if(ext==='docx') return loadLib(LIBS.mammoth,'mammoth').then(function(){ return file.arrayBuffer(); })
    .then(function(buf){ return window.mammoth.convertToHtml({arrayBuffer:buf}); })
    .then(function(res){
      var doc=new DOMParser().parseFromString(res.value,'text/html'), trs=doc.querySelectorAll('tr');   /* DOMParser never runs scripts */
      if(trs.length) return Array.prototype.map.call(trs,function(tr){ return Array.prototype.map.call(tr.children,function(td){return td.textContent.trim();}); });
      /* no table: one family per line, "name, count" or "name - count" or "name<tab>count" */
      return Array.prototype.map.call(doc.querySelectorAll('p,li'),function(p){
        var t=p.textContent.trim(), m=t.match(/^(.*?)[\s,\-–:]+(\d{1,2})\s*$/);
        return t.indexOf('\t')>=0 ? t.split('\t').map(function(x){return x.trim();}) : m ? [m[1].trim(), m[2]] : [t];
      });
    });
  if(['xlsx','xls','csv'].indexOf(ext)<0) return Promise.reject(new Error('אפשר להעלות קובץ אקסל (xlsx, xls), CSV או וורד (docx).'));
  return loadLib(LIBS.xlsx,'XLSX').then(function(){ return ext==='csv' ? file.text() : file.arrayBuffer(); })
    .then(function(data){
      var wb=window.XLSX.read(data,{type: ext==='csv'?'string':'array'}), ws=wb.Sheets[wb.SheetNames[0]];
      return window.XLSX.utils.sheet_to_json(ws,{header:1, defval:'', raw:false}).map(function(r){ return r.map(function(c){return String(c).trim();}); });
    });
}
/* order matters: "מספר טלפון" is a phone column, "מספר מוזמנים" a count column */
var GUEST_COLS=[['phone',/טלפון|נייד|פלאפון|phone|mobile|tel/i],['status',/סטטוס|אישור|מגיע|status|rsvp/i],['side',/צד|קבוצה|שיוך|side|group/i],
  ['size',/כמות|מספר|מס'|אנשים|מוזמנים|size|count|qty|guests/i],['name',/שם|משפחה|מוזמן|אורח|name/i]];
function isCount(v){ return /^\d{1,2}$/.test(v) && +v>=1 && +v<=50; }
function rowsToHouseholds(rows, ev){
  rows=rows.filter(function(r){ return r.some(function(c){return c;}); });
  var col={name:[]}, start=0;
  /* a header row in the first five rows: a cell that names one of the columns */
  for(var i=0;i<Math.min(5,rows.length) && start===0;i++){
    var found={name:[]};
    rows[i].forEach(function(c,j){ for(var k=0;k<GUEST_COLS.length;k++){ var key=GUEST_COLS[k][0];
      if(c && GUEST_COLS[k][1].test(c) && c.length<30){ if(key==='name') found.name.push(j); else if(found[key]==null) found[key]=j; return; } } });
    if(found.name.length){ col=found; start=i+1; }
  }
  if(!col.name.length){   /* no header: names = first mostly-text column, count = first mostly-small-number column */
    if(rows.length>1 && rows[0].filter(Boolean).length===1 && /רשימ|list/i.test(rows[0].join(''))) start=1;   /* a title line like "רשימת מוזמנים" */
    var w=Math.max.apply(null,[0].concat(rows.map(function(r){return r.length;})));
    for(var j=0;j<w;j++){
      var vals=rows.slice(start).map(function(r){return r[j]||'';}).filter(Boolean), nums=vals.filter(isCount).length;
      if(!col.name.length && nums<vals.length/2) col.name=[j];
      else if(col.size==null && nums>=vals.length/2) col.size=j;
    }
  }
  var out=[], skipped=0;
  rows.slice(start).forEach(function(r){
    var name=col.name.map(function(j){return r[j]||'';}).join(' ').replace(/\s+/g,' ').trim();
    if(!name){ skipped++; return; }
    var sz=col.size!=null? parseInt(r[col.size],10) : 1, st=col.status!=null? r[col.status]||'' : '';
    out.push({id:nextId('g'), name:name, size: sz>=1 && sz<=50 ? sz : 1,
      side:(col.side!=null && r[col.side]) || 'ללא שיוך', phone:col.phone!=null? r[col.phone]||'' : '',
      status: /לא|no|✗|✕/i.test(st) ? 'n' : /כן|מגיע|אישר|yes|✓|✔|^v$/i.test(st) ? 'y' : 'p', table:-1});
  });
  return {households:out, skipped:skipped};
}
function guestFilePicked(file){
  var ev=curEvent(); if(!ev || !file) return;
  S.ui.imp={eventId:ev.id, file:file.name, households:[], loading:true}; render(true);
  readGuestFile(file).then(function(rows){
    var res=rowsToHouseholds(rows, ev);
    S.ui.imp={eventId:ev.id, file:file.name, households:res.households, skipped:res.skipped,
      error: res.households.length? null : 'לא מצאנו בקובץ שמות של מוזמנים. ודאו שיש עמודה עם שם לכל משפחה.'};
    render(true);
  }, function(e){ S.ui.imp={eventId:ev.id, file:file.name, households:[], error:e.message||'לא הצלחנו לקרוא את הקובץ.'}; render(true); });
}
function applyImport(mode){

  if(!ev || !im || mode==='cancel'){ render(true); return; }

  if(mode==='replace'){ ev.households=im.households; ev.tableCount=0; ev.tableCaps={}; ev.cons=[]; }
  else ev.households=ev.households.concat(im.households);

  render(true);
  toast((mode==='replace'?'הרשימה הוחלפה · ':'נוספו ')+im.households.length+' משפחות ('+hsum(im.households)+' אורחים)', function(){
    ev.households=snap.hh; ev.tableCount=snap.n; ev.tableCaps=snap.caps; ev.cons=snap.cons; ev.sides=snap.sides; render(true); });

function downloadTemplate(){
  var csv='\ufeff'+['שם,כמות,צד,טלפון,סטטוס','משפחת כהן,4,צד הכלה,050-1234567,מגיע','דנה ויואב לוי,2,חברים,052-7654321,'].join('\r\n');   /* BOM so Excel reads Hebrew */

/* ---------- seating actions ---------- */
function curEvent(){ return ROUTE.view==='event' ? eventById(ROUTE.id) : null; }
function seatSnap(ev){ var m={}; ev.households.forEach(function(h){m[h.id]=h.table;}); return {m:m, n:ev.tableCount, caps:Object.assign({},ev.tableCaps)}; }
function seatRestore(ev,s){ ev.households.forEach(function(h){h.table=s.m[h.id];}); ev.tableCount=s.n; ev.tableCaps=s.caps; }
function moveHH(id, t){

function seatSolve(mode){
  var ev=curEvent(); if(!ev) return; var snap=seatSnap(ev);

  /* households that must sit together become one unit */
  var parent={}; pending.forEach(function(h){parent[h.id]=h.id;});
  function find(x){ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; }
  ev.cons.forEach(function(c){ if(c.t==='yes' && parent[c.a] && parent[c.b]){ var ra=find(c.a), rb=find(c.b); if(ra!==rb) parent[ra]=rb; } });

/* signup and sign-in checks; returns [inputId, message] for every field with a problem */
var MAIL_TYPOS={'gmai.com':'gmail.com','gmial.com':'gmail.com','gamil.com':'gmail.com','gmal.com':'gmail.com','gmaill.com':'gmail.com','gmail.co':'gmail.com','gmail.con':'gmail.com','gmail.co.il':'gmail.com',
  'hotmial.com':'hotmail.com','hotmai.com':'hotmail.com','hotmail.co':'hotmail.com','yaho.com':'yahoo.com','yahoo.co':'yahoo.com','walla.co':'walla.co.il','wala.co.il':'walla.co.il','iclod.com':'icloud.com','icloud.co':'icloud.com','outlok.com':'outlook.com'};
function authProblems(up, meta, email, pass){
  var out=[];
  if(up){
    if(!meta.hall_name) out.push(['au-hname','מלאו את שם האולם.']);
    if(!meta.city) out.push(['au-city','מלאו את העיר.']);
    if(!meta.contact) out.push(['au-contact','מלאו את שם איש הקשר.']);
    var digits=meta.phone.replace(/[\s\-()]/g,'').replace(/^\+972/,'0');
    if(!meta.phone) out.push(['au-phone','מלאו מספר טלפון.']);
    else if(!/^0\d{8,9}$/.test(digits)) out.push(['au-phone','מספר הטלפון לא תקין. למשל \u2066050-1234567\u2069.']);
  }
  var dom=(email.split('@')[1]||'').toLowerCase();
  if(!email) out.push(['au-email','מלאו כתובת מייל.']);
  else if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)) out.push(['au-email','כתובת המייל שגויה.']);
  else if(MAIL_TYPOS[dom]) out.push(['au-email','כתובת המייל שגויה. התכוונתם ל-\u2066'+email.split('@')[0]+'@'+MAIL_TYPOS[dom]+'\u2069?'   /* isolate keeps the address left-to-right inside Hebrew */]);
  if(!pass) out.push(['au-pass','מלאו סיסמה.']);
  else if(up && pass.length<6) out.push(['au-pass','הסיסמה צריכה להיות באורך 6 תווים לפחות.']);
  return out;
}
/* typing in a field clears its error */
$('#f-auth').addEventListener('input',function(e){ var f=e.target.closest('.field'); if(f && f.classList.contains('bad')){ f.classList.remove('bad'); e.target.removeAttribute('aria-invalid'); var m=$('.fmsg',f); if(m) m.remove(); } });
$('#f-auth').addEventListener('submit',function(e){
  e.preventDefault();
  var up=!$('#au-hall').hidden, email=$('#au-email').value.trim(), pass=$('#au-pass').value, err=$('#au-err');
  /* signup details ride on the account (user metadata), so they survive the email confirmation step */
  var meta={hall_name:$('#au-hname').value.trim(), city:$('#au-city').value.trim(), contact:$('#au-contact').value.trim(), phone:$('#au-phone').value.trim()};
  /* nothing goes to the server until every field passes */
  var bad=authProblems(up, meta, email, pass);
  $$('#f-auth .field').forEach(function(f){ f.classList.remove('bad'); var m=$('.fmsg',f); if(m) m.remove(); var i=$('input',f); if(i) i.removeAttribute('aria-invalid'); });
  bad.forEach(function(b){ var inp=$('#'+b[0]), f=inp.closest('.field'); f.classList.add('bad'); inp.setAttribute('aria-invalid','true');
    var m=document.createElement('span'); m.className='fmsg'; m.id=b[0]+'-msg'; m.textContent=b[1]; f.appendChild(m); inp.setAttribute('aria-describedby',m.id); });
  err.textContent='';
  if(bad.length){ $('#'+bad[0][0]).focus(); return; }
  var call = up ? db.auth.signUp({email:email, password:pass, options:{data:meta, emailRedirectTo:location.origin+location.pathname}}) : db.auth.signInWithPassword({email:email, password:pass});
  call.then(function(r){
    if(r.error){ var m=r.error.message||'';
      err.textContent = m==='Invalid login credentials' ? 'המייל או הסיסמה לא נכונים.'
        : m==='Email not confirmed' ? 'המייל עוד לא אושר. לחצו על הקישור במייל ששלחנו ואז היכנסו.'
        : r.error.status===429 ? 'יותר מדי ניסיונות. חכו דקה ונסו שוב.'
        : /sending confirmation email/i.test(m) ? 'לא הצלחנו לשלוח מייל לכתובת הזו. בדקו שהמייל כתוב נכון.'
        : /already registered/i.test(m) ? 'המייל הזה כבר רשום. היכנסו עם הסיסמה שלו.'
        : 'לא הצלחנו: '+m;
      return; }
    if(!r.data.session){ err.textContent='שלחנו לכם מייל. אשרו אותו ואז היכנסו.'; setAuthMode(false); return; }
    startHall(r.data.user);
  });
});
